name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New standard library vulnerabilities appear, and the pinned MSFS SDK
  # installer may go away, without a code change: the weekly run is
  # govulncheck and the release bundle only.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # The release workflow runs all of this before publishing.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash on every runner including Windows: GitHub starts it with
# -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

# go.mod's toolchain line is the Go every job uses, locally too: a current
# stable release, so that the binary does not ship a standard library with
# known vulnerabilities. Dependabot doesn't bump it; a failing weekly
# govulncheck is the signal to bump it and release. Caching is off: the
# suite takes seconds, the main module has no dependencies, and the tools
# module is small.

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Most of the code is Windows-only (SimConnect, the Win32 tray, COM
      # ports), which a Linux run never loads: make lint runs both, with
      # the golangci-lint the Makefile pins and checksums.
      - run: make lint

  # Windows is where the binary runs and the Win32 code paths are tested.
  test:
    if: github.event_name != 'schedule'
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The race detector needs cgo and a C compiler: the MinGW gcc of the
      # Windows image. Fail here, clearly, should the image drop it.
      - if: runner.os == 'Windows'
        run: gcc --version
      # make test's command, without make, which Windows lacks.
      - env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          go test -race -count=1 -coverprofile=build/coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage.out
          flags: ${{ runner.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only a push to main fails on a Codecov outage, not a release.
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make build verify-version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SkyDemonConnect
          path: build/SkyDemonConnect.exe
          retention-days: 30

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make govulncheck

  # The release zip, with SimConnect.dll from the pinned MSFS SDK installer
  # (650 MB): built weekly and on demand, so that a broken bundle shows
  # before a tag is pushed, not after.
  bundle:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends msitools
      - run: make bundle

  tidy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-tidy

  typos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
