name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New standard library vulnerabilities appear, and the pinned MSFS SDK
  # installer may go away, without a code change: the weekly run is
  # govulncheck and the release bundle only.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # The release workflow runs all of this before publishing.
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# bash on every runner including Windows: GitHub starts it with
# -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

# The toolchain line of go.mod, which tools/go.mod repeats (make
# verify-tidy checks that they agree), is the Go every job uses, locally
# too: a current stable release, so that the binary does not ship a
# standard library with known vulnerabilities. Dependabot doesn't bump it;
# a failing weekly govulncheck is the signal to bump it and release.
# Caching is off: the suite takes seconds, the main module has no
# dependencies, and the tools module is small.

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # Most of the code is Windows-only (SimConnect, the Win32 tray, COM
      # ports), which a Linux run never loads: make lint runs both, with
      # the golangci-lint the Makefile pins and checksums.
      - run: make lint

  format:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make verify-format
        env:
          CONTAINER_RUNTIME: docker

  # Windows is where the binary runs and the Win32 code paths are tested.
  test:
    if: github.event_name != 'schedule'
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The race detector needs cgo and a C compiler: the MinGW gcc of the
      # Windows image. Fail here, clearly, should the image drop it.
      - if: runner.os == 'Windows'
        run: gcc --version
      # make test's command, without make, which Windows lacks.
      - env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p build
          go test -race -count=1 -coverprofile=build/coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: build/coverage.out
          flags: ${{ runner.os }}
          token: ${{ secrets.CODECOV_TOKEN }}
          # Only a push to main fails on a Codecov outage, not a release.
          fail_ci_if_error: ${{ github.ref == 'refs/heads/main' }}

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make build verify-version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SkyDemonConnect
          path: build/SkyDemonConnect.exe
          retention-days: 30

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make govulncheck

  # The release zip, with SimConnect.dll from the pinned MSFS SDK installer
  # (650 MB): built weekly, on demand and on a push to main that changes
  # what goes into it or the SimConnect binding, so that a broken bundle,
  # or a binding the real DLL rejects, shows before a tag is pushed.
  bundle:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      built: ${{ steps.changed.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe for the version
      # Without a diff, e.g. on a first or a forced push, it is built.
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]] ||
            ! files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null) ||
            grep -qE '^(Makefile|go\.mod|LICENSE|NOTICE\.md|docs/reference\.md|internal/(zipfiles|simconnect)/|tools/|\.github/workflows/(ci|simconnect-dll)\.yml)' <<<"$files"; then
            echo build=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.build == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The two files make bundle keeps from the installer, which it checks
      # again; a hit saves about 35 seconds, when the entry is younger than
      # GitHub's 7 days. The weekly run downloads the installer, to see that
      # it's there. release doesn't use the cache: restoring unpacks a tar
      # that any job with the runtime token could have saved, anywhere.
      - if: steps.changed.outputs.build == 'true'
        id: sdk
        run: echo "key=$(make -s sdk-cache-key)" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.build == 'true' && github.event_name != 'schedule'
        id: sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sdk-*
          key: ${{ steps.sdk.outputs.key }}
      - if: steps.changed.outputs.build == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends msitools
      - if: steps.changed.outputs.build == 'true'
        run: make bundle
      - if: steps.changed.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simconnect-dll
          path: build/sdk-*/SimConnect.dll
          if-no-files-found: error
          retention-days: 7

  simconnect-dll:
    needs: bundle
    if: needs.bundle.outputs.built == 'true'
    uses: ./.github/workflows/simconnect-dll.yml
    with:
      artifact: simconnect-dll

  # The Makefile's Windows-host path (.exe tools, the zipped golangci-lint,
  # unzip), in Git Bash as a contributor on Windows would run it.
  make-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          missing=()
          for tool in make unzip; do
            command -v "$tool" >/dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            choco install -y --no-progress "${missing[@]}"
          fi
      - run: make lint build

  tidy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make verify-tidy

  typos:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2
