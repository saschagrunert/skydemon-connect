name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

defaults:
  run:
    shell: bash

jobs:
  # Only commits on main are released, and only tags that are a version:
  # the tag name ends up in make variables and file names.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  # Everything ci runs for a pull request, with read-only permissions.
  ci:
    needs: check
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The zip is built without write permissions: the build runs go-winres,
  # msitools and the SDK installer's contents.
  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The zip ships SimConnect.dll from the MSFS SDK installer, an MSI.
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends msitools
      - run: make bundle VERSION="$GITHUB_REF_NAME"
      - run: cd build && sha256sum SkyDemonConnect-*.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/SkyDemonConnect-*.zip
            build/SkyDemonConnect.exe
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simconnect-dll
          path: build/sdk-*/SimConnect.dll
          if-no-files-found: error
          retention-days: 7

  # The SimConnect.dll in this zip, tested as ci tests its own download.
  simconnect-dll:
    needs: build
    uses: ./.github/workflows/simconnect-dll.yml
    with:
      artifact: simconnect-dll

  # Attests and publishes what build made; runs no build tools. The
  # release environment waits for the maintainer's approval.
  release:
    needs: [build, simconnect-dll]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/SkyDemonConnect-*.zip
            build/SkyDemonConnect.exe
      # Only the zip is published: a bare exe lacks SimConnect.dll. Tags with
      # a hyphen (v1.0.0-rc.1) become pre-releases.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME"
            --notes "Download SkyDemonConnect-$GITHUB_REF_NAME.zip, extract it to a folder of its own and start SkyDemonConnect.exe. See the README for details.")
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            build/SkyDemonConnect-*.zip build/SHA256SUMS
